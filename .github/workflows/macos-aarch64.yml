name: macOS AArch64 CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/q02-*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-aarch64:
    name: macOS 15 / AArch64
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify native test target and pinned toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup show active-toolchain

      - name: Check formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path fuzz/Cargo.toml --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test including AOT and repository consistency
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Build documentation
        run: cargo doc --locked --workspace --no-deps

      - name: Check fuzz targets
        run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --bins -- -D warnings

      - name: Validate benchmark evidence checks
        run: |
          python3 -m unittest discover -s tools/m2-bench -p 'test_*.py'
          python3 -m unittest discover -s tools/m3-bench -p 'test_*.py'
