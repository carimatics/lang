name: macOS AArch64 CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'codex/q02-*'
      - 'codex/ci-*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-aarch64:
    name: macOS ${{ matrix.version }} / AArch64 / ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        version: [26, 15]
        # Four jobs fit the repository's five concurrent macOS runner slots.
        shard: [core, native-all]
    runs-on: macos-${{ matrix.version }}
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify native test target and pinned toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup show active-toolchain

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-${{ matrix.version }}-${{ matrix.shard }}
          workspaces: |
            . -> target
            fuzz -> target

      - name: Check formatting
        if: matrix.shard == 'core'
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path fuzz/Cargo.toml --check

      - name: Lint
        if: matrix.shard == 'core'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test including AOT and repository consistency
        run: python3 tools/ci/run_tests.py ${{ matrix.shard }}

      - name: Build documentation
        if: matrix.shard == 'core'
        run: cargo doc --locked --workspace --no-deps

      - name: Check fuzz targets
        if: matrix.shard == 'core'
        run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --bins -- -D warnings

      - name: Validate benchmark evidence checks
        if: matrix.shard == 'core'
        run: |
          python3 -m unittest discover -s tools/ci -p 'test_*.py'
          python3 -m unittest discover -s tools/m2-bench -p 'test_*.py'
          python3 -m unittest discover -s tools/m3-bench -p 'test_*.py'
