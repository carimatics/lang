name: Native source debug validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.gitattributes'
      - 'src/**'
      - 'crates/**'
      - 'tests/native_compiler.rs'
      - 'tests/native_debug_windows.rs'
      - 'tests/support/rust_artifacts.rs'
      - 'tools/build-native-sdk.py'
      - 'tools/check-native-debugger.py'
      - 'tools/check-native-dap.py'
      - 'tools/setup-native-dap.ps1'
      - 'tools/test_native_debugger.py'
      - 'docs/native-sdk.md'
      - 'docs/ja/native-sdk.md'
      - '.github/workflows/native-debug.yml'
  push:
    branches:
      - main
      - 'codex/debug-*'
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.gitattributes'
      - 'src/**'
      - 'crates/**'
      - 'tests/native_compiler.rs'
      - 'tests/native_debug_windows.rs'
      - 'tests/support/rust_artifacts.rs'
      - 'tools/build-native-sdk.py'
      - 'tools/check-native-debugger.py'
      - 'tools/check-native-dap.py'
      - 'tools/setup-native-dap.ps1'
      - 'tools/test_native_debugger.py'
      - 'docs/native-sdk.md'
      - 'docs/ja/native-sdk.md'
      - '.github/workflows/native-debug.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Source debug execution / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check debugger evidence validation
        run: python -m unittest discover -s tools -p 'test_*.py'

      - name: Configure the x86-64 MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Record native debug tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:ProgramFiles\LLVM\bin\llvm-pdbutil.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($tool in @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe",
            "$env:ProgramFiles\LLVM\bin\lldb.exe",
            "$env:ProgramFiles\LLVM\bin\lldb-dap.exe"
          )) {
            Write-Host "$tool available: $(Test-Path $tool)"
          }

      - name: Prepare the pinned Windows DAP distribution
        if: runner.os == 'Windows'
        id: lldb-distribution
        shell: pwsh
        run: tools/setup-native-dap.ps1 -OutputDirectory "${{ runner.temp }}/lang-lldb-dap"

      # Inspect the selected DLL rather than assuming the runner's Python ABI.
      # Keep the ordinary job interpreter unchanged.
      - name: Select the Windows LLVM Python runtime
        if: runner.os == 'Windows' && steps.lldb-distribution.outputs.python-version != ''
        id: lldb-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ steps.lldb-distribution.outputs.python-version }}
          architecture: x64
          update-environment: false

      - name: Restore the exact matching debug SDK
        id: sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lang-debug-sdk
          key: native-debug-sdk-v1-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('**/*.rs', '**/*.toml', '**/*.h', '**/*.c', '**/*.wit', 'Cargo.lock', 'schema/**', '.cargo/**', '.gitattributes', 'docs/native-sdk.md', 'docs/ja/native-sdk.md', 'tools/build-native-sdk.py') }}

      - name: Validate all source CodeView profiles with bounded tools
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: cargo test --locked --test native_debug_windows --all-features -- --nocapture

      - name: Validate linked Mach-O function addresses
        if: runner.os == 'macOS' && steps.sdk-cache.outputs.cache-hit != 'true'
        run: cargo test --locked --test native_compiler --all-features linked_copy_and_owned_dwarf_ranges_match_each_native_body -- --nocapture

      - name: Build the matching native SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: python tools/build-native-sdk.py --output "${{ runner.temp }}/lang-debug-sdk"

      - name: Save the built SDK before debugger execution
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lang-debug-sdk
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

      - name: Enable debugger authorization on the ephemeral macOS runner
        if: runner.os == 'macOS'
        run: sudo /usr/sbin/DevToolsSecurity -enable

      - name: Exercise actual native breakpoints, stepping and backtraces
        run: python tools/check-native-debugger.py --sdk "${{ runner.temp }}/lang-debug-sdk" --output "${{ runner.temp }}/lang-debug-probes"

      - name: Exercise actual native DAP launch and source breakpoints
        env:
          LLDB_DAP_EXECUTABLE: ${{ steps.lldb-distribution.outputs.adapter }}
          LLDB_PYTHON_RUNTIME: ${{ steps.lldb-python.outputs.python-path }}
          LLDB_PYTHON_DLL: ${{ steps.lldb-distribution.outputs.python-dll }}
        run: python tools/check-native-dap.py --sdk "${{ runner.temp }}/lang-debug-sdk" --output "${{ runner.temp }}/lang-native-dap-probes"

      - name: Upload native debugger evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-debug-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/lang-debug-probes/*.log
            ${{ runner.temp }}/lang-debug-probes/*.json
            ${{ runner.temp }}/lang-debug-probes/*.lang
            ${{ runner.temp }}/lang-native-dap-probes/*.json
            ${{ runner.temp }}/lang-native-dap-probes/*.lang
          if-no-files-found: warn
          retention-days: 14
