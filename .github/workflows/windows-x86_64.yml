name: Windows x86-64 CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-msvc:
    name: Windows Server 2025 / x86-64 MSVC
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure the x86-64 MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Select the pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path fuzz/Cargo.toml --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Build documentation
        run: cargo doc --locked --workspace --no-deps

      - name: Record the schema 20 prototype benchmark
        shell: pwsh
        run: |
          $benchmark = Join-Path $env:RUNNER_TEMP "prototype-benchmark-windows-x86_64-msvc.json"
          cargo run --locked --release --bin prototype-bench -- --samples 31 --lowering-iterations 1000 --runtime-iterations 100000 --startup-iterations 10 | Tee-Object -FilePath $benchmark
          if ($LASTEXITCODE -ne 0) {
            throw "prototype-bench failed with exit code $LASTEXITCODE"
          }

          $result = Get-Content $benchmark -Raw | ConvertFrom-Json
          if ($result.schema_version -ne 20) {
            throw "expected benchmark schema 20, got $($result.schema_version)"
          }
          if ($result.git_dirty) {
            throw "benchmark must run from a clean checkout"
          }
          if ($result.os -ne "windows" -or $result.architecture -ne "x86_64") {
            throw "unexpected benchmark target $($result.os)/$($result.architecture)"
          }
          if ($result.measurements.name -notcontains "system_link_add_min_countdown_fibonacci_sum_to_sum_below") {
            throw "benchmark did not record the Windows system-link measurement"
          }
          if ($result.measurements.name -notcontains "aot_process_startup_add_min_countdown_fibonacci_sum_to_sum_below") {
            throw "benchmark did not record the Windows process-startup measurement"
          }
          if ($result.measurements.name -notcontains "aot_process_startup_batch_add_min_countdown_fibonacci_sum_to_sum_below") {
            throw "benchmark did not record the Windows batched process-startup measurement"
          }
          if ($result.measurements.name -notcontains "vm_sum_to_call" -or $result.measurements.name -notcontains "jit_sum_to_call") {
            throw "benchmark did not record the Windows accumulator measurements"
          }
          if ($result.measurements.name -notcontains "vm_sum_below_call" -or $result.measurements.name -notcontains "jit_sum_below_call") {
            throw "benchmark did not record the Windows conditional-loop measurements"
          }
          if ($result.measurements.name -notcontains "rust_fibonacci_call" -or $result.measurements.name -notcontains "vm_fibonacci_call" -or $result.measurements.name -notcontains "jit_fibonacci_call") {
            throw "benchmark did not record the Windows fibonacci measurements"
          }
          if ($result.generated_code_bytes.jit_fibonacci -le 0 -or $result.object_file_bytes.aot_fibonacci -le 0) {
            throw "benchmark did not record the Windows fibonacci artifact sizes"
          }
          if ($result.generated_code_bytes.jit_component_scalar -le 0 -or $result.object_file_bytes.aot_component_scalar -le 0 -or $result.component_document_bytes.schema2_contract -le 0 -or $result.component_document_bytes.schema2_redacted_failure_report -le 0) {
            throw "benchmark did not record the component artifact sizes"
          }
          if ($result.measurements.name -notcontains "vm_countdown_interruptible_call") {
            throw "benchmark did not record the Windows interruption-check measurement"
          }
          if ($result.measurements.name -notcontains "vm_countdown_deadline_call") {
            throw "benchmark did not record the Windows deadline-check measurement"
          }
          if ($result.measurements.name -notcontains "rust_host_allocation_call" -or $result.measurements.name -notcontains "vm_host_allocation_call" -or $result.measurements.name -notcontains "jit_host_allocation_call") {
            throw "benchmark did not record the Windows host-allocation measurements"
          }
          if ($result.measurements.name -notcontains "rust_host_allocation_burst_call" -or $result.measurements.name -notcontains "vm_host_allocation_burst_call" -or $result.measurements.name -notcontains "jit_host_allocation_burst_call") {
            throw "benchmark did not record the Windows host-allocation burst measurements"
          }
          if ($result.measurements.name -notcontains "rust_host_allocation_churn_call" -or $result.measurements.name -notcontains "vm_host_allocation_churn_call" -or $result.measurements.name -notcontains "jit_host_allocation_churn_call") {
            throw "benchmark did not record the Windows host-allocation churn measurements"
          }
          if ($result.measurements.name -notcontains "rust_host_allocation_variable_call" -or $result.measurements.name -notcontains "vm_host_allocation_variable_call" -or $result.measurements.name -notcontains "jit_host_allocation_variable_call") {
            throw "benchmark did not record the Windows variable-size host-allocation measurements"
          }
          $componentRows = @($result.component_boundary_measurements)
          $requiredComponentRows = @(
            "component_metadata_validate_scalar",
            "component_interface_negotiate_three_candidates",
            "component_scalar_dispatch_direct",
            "component_scalar_dispatch_validated",
            "resource_table_owner_insert_release",
            "resource_table_shared_borrow_end_release",
            "canonical_resource_owner_transfer_persist",
            "canonical_resource_borrow_scope_cleanup",
            "component_instantiate_schema2_unlocked",
            "component_lockfile_replay_instantiate",
            "host_value_publish_transfer_release",
            "component_guest_trap_cleanup_failure_report",
            "component_destructor_failure_cleanup_report",
            "component_application_negotiate_lock_replay_instantiate_execute_cleanup"
          )
          foreach ($row in $requiredComponentRows) {
            if ($componentRows.name -notcontains $row) {
              throw "benchmark did not record component-boundary row $row"
            }
          }
          $requiredComponentSeries = @("metadata_validation", "interface_negotiation", "scalar_dispatch", "resource_lifecycle", "instantiation", "host_value_lifecycle", "failure_cleanup", "representative_application")
          foreach ($series in $requiredComponentSeries) {
            if ($componentRows.series -notcontains $series) {
              throw "benchmark did not record component-boundary series $series"
            }
          }
          if ($result.heap_measurement_scope -ne "host_callback_requested_payload_bytes") {
            throw "benchmark recorded unexpected heap measurement scope $($result.heap_measurement_scope)"
          }
          $singleHeap = @($result.heap_measurements | Where-Object { $_.name -eq "host_allocation_call" })
          if ($singleHeap.Count -ne 1 -or $singleHeap[0].allocation_count -ne 1 -or $singleHeap[0].total_allocated_bytes -ne 8 -or $singleHeap[0].peak_live_bytes -ne 8 -or $singleHeap[0].live_bytes_after -ne 0) {
            throw "benchmark recorded unexpected single-allocation heap measurements"
          }
          $burstHeap = @($result.heap_measurements | Where-Object { $_.name -eq "host_allocation_burst_call" })
          if ($burstHeap.Count -ne 1 -or $burstHeap[0].allocation_count -ne 64 -or $burstHeap[0].total_allocated_bytes -ne 512 -or $burstHeap[0].peak_live_bytes -ne 512 -or $burstHeap[0].live_bytes_after -ne 0) {
            throw "benchmark recorded unexpected allocation-burst heap measurements"
          }
          $churnHeap = @($result.heap_measurements | Where-Object { $_.name -eq "host_allocation_churn_call" })
          if ($churnHeap.Count -ne 1 -or $churnHeap[0].allocation_count -ne 96 -or $churnHeap[0].total_allocated_bytes -ne 768 -or $churnHeap[0].peak_live_bytes -ne 512 -or $churnHeap[0].live_bytes_after -ne 0) {
            throw "benchmark recorded unexpected allocation-churn heap measurements"
          }
          $variableHeap = @($result.heap_measurements | Where-Object { $_.name -eq "host_allocation_variable_call" })
          if ($variableHeap.Count -ne 1 -or $variableHeap[0].allocation_count -ne 16 -or $variableHeap[0].total_allocated_bytes -ne 1088 -or $variableHeap[0].peak_live_bytes -ne 1088 -or $variableHeap[0].live_bytes_after -ne 0) {
            throw "benchmark recorded unexpected variable-size allocation heap measurements"
          }
          $representative = $result.representative_allocation_workload
          if ($representative.name -ne "compiler_like_mixed_lifetime_allocation" -or $representative.allocation_count -ne 23894 -or $representative.total_requested_bytes -ne 19183210 -or $representative.peak_live_requested_bytes -ne 18102042 -or $representative.live_requested_bytes_after -ne 0) {
            throw "benchmark recorded unexpected representative allocation workload profile"
          }
          if ($representative.control_median_peak_resident_bytes -le 0 -or $representative.workload_median_peak_resident_bytes -le $representative.control_median_peak_resident_bytes -or $representative.median_peak_resident_delta_bytes -ne ($representative.workload_median_peak_resident_bytes - $representative.control_median_peak_resident_bytes) -or $representative.estimated_allocator_overhead_and_fragmentation_bytes_at_median -lt 0) {
            throw "benchmark recorded invalid representative allocation process-memory evidence"
          }
          if ($result.process_memory_measurement_scope -ne "separate_process_peak_resident_memory") {
            throw "benchmark recorded unexpected process-memory scope $($result.process_memory_measurement_scope)"
          }
          if ($result.process_memory_metric -ne "windows_process_peak_working_set_bytes") {
            throw "benchmark recorded unexpected process-memory metric $($result.process_memory_metric)"
          }
          $processMemory = @($result.process_memory_measurements | Where-Object { $_.name -eq "aot_process_peak_resident_memory_add_min_countdown_fibonacci_sum_to_sum_below" })
          if ($processMemory.Count -ne 1 -or $processMemory[0].unit -ne "bytes/process" -or $processMemory[0].sample_count -ne 31 -or $processMemory[0].minimum -le 0 -or $processMemory[0].median -lt $processMemory[0].minimum -or $processMemory[0].p95 -lt $processMemory[0].median -or $processMemory[0].maximum -lt $processMemory[0].p95) {
            throw "benchmark recorded invalid Windows process-memory measurements"
          }
          $controlMemory = @($result.process_memory_measurements | Where-Object { $_.name -eq "benchmark_process_control_peak_resident_memory" })
          $workloadMemory = @($result.process_memory_measurements | Where-Object { $_.name -eq "benchmark_process_representative_allocation_peak_resident_memory" })
          if ($controlMemory.Count -ne 1 -or $workloadMemory.Count -ne 1 -or $controlMemory[0].sample_count -ne 31 -or $workloadMemory[0].sample_count -ne 31 -or $controlMemory[0].median -le 0 -or $workloadMemory[0].median -le $controlMemory[0].median) {
            throw "benchmark recorded invalid representative allocation process-memory rows"
          }
          $componentMemory = @($result.process_memory_measurements | Where-Object { $_.name -eq "benchmark_process_component_instances_peak_resident_memory" })
          if ($result.component_instance_memory_profile.retained_instance_count -ne 4096 -or $result.component_instance_memory_profile.process_measurement -ne "benchmark_process_component_instances_peak_resident_memory" -or $componentMemory.Count -ne 1 -or $componentMemory[0].sample_count -ne 31 -or $componentMemory[0].median -le $controlMemory[0].median) {
            throw "benchmark recorded invalid component-instance process-memory evidence"
          }
          if ($result.startup_iterations -ne 10) {
            throw "benchmark recorded unexpected startup iterations $($result.startup_iterations)"
          }
          if ($result.executable_file_bytes.aot_add_min_countdown_fibonacci_sum_to_sum_below -le 0) {
            throw "benchmark did not record the Windows executable size"
          }

      - name: Upload the prototype benchmark
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prototype-benchmark-windows-x86_64-msvc
          path: ${{ runner.temp }}\prototype-benchmark-windows-x86_64-msvc.json
          if-no-files-found: error
          retention-days: 30
