[workspace]
members = [
    ".",
    "crates/bytecode",
    "crates/codegen-clif",
    "crates/diagnostics",
    "crates/hir",
    "crates/lsp",
    "crates/mir",
    "crates/query",
    "crates/runtime",
    "crates/semantics",
    "crates/syntax",
    "crates/vm",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
cranelift-codegen = { version = "0.136.0", features = ["x86"] }
cranelift-frontend = "0.136.0"
cranelift-jit = "0.136.0"
cranelift-module = "0.136.0"
cranelift-native = "0.136.0"
cranelift-object = "0.136.0"
gimli = { version = "0.33.0", default-features = false, features = ["std", "write"] }
lang-bytecode = { path = "crates/bytecode" }
lang-codegen-clif = { path = "crates/codegen-clif" }
lang-diagnostics = { path = "crates/diagnostics" }
lang-hir = { path = "crates/hir" }
lang-lsp = { path = "crates/lsp" }
lang-mir = { path = "crates/mir" }
lang-query = { path = "crates/query" }
lang-runtime = { path = "crates/runtime" }
lang-semantics = { path = "crates/semantics" }
lang-syntax = { path = "crates/syntax" }
lang-vm = { path = "crates/vm" }
object = { version = "0.40.0", default-features = false, features = ["coff", "macho", "read_core", "std", "write"] }
target-lexicon = "0.13.5"

[package]
name = "lang"
version.workspace = true
edition.workspace = true

[dependencies]
lang-bytecode.workspace = true
lang-codegen-clif.workspace = true
lang-mir.workspace = true
lang-runtime.workspace = true
lang-vm.workspace = true

[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
lang-diagnostics.workspace = true
lang-hir.workspace = true
lang-semantics.workspace = true
object.workspace = true
