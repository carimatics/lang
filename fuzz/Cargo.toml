[package]
name = "lang-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "toolchain_profiles"
path = "fuzz_targets/toolchain_profiles.rs"
test = false
doc = false
bench = false

[[bin]]
name = "package_metadata"
path = "fuzz_targets/package_metadata.rs"
test = false
doc = false
bench = false

[dependencies]
libfuzzer-sys = "0.4"
ed25519-dalek = "=3.0.0"
serde_json = "1.0"
lang = { path = ".." }
lang-runtime = { path = "../crates/runtime" }
lang-diagnostics = { path = "../crates/diagnostics" }
lang-syntax = { path = "../crates/syntax" }
lang-hir = { path = "../crates/hir" }
lang-bytecode = { path = "../crates/bytecode" }
lang-mir = { path = "../crates/mir" }
lang-vm = { path = "../crates/vm" }
lang-codegen-clif = { path = "../crates/codegen-clif" }

