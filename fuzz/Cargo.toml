[package]
name = "lang-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lang-runtime = { path = "../crates/runtime" }
lang-diagnostics = { path = "../crates/diagnostics" }
lang-syntax = { path = "../crates/syntax" }
lang-hir = { path = "../crates/hir" }
lang-bytecode = { path = "../crates/bytecode" }
lang-mir = { path = "../crates/mir" }
lang-vm = { path = "../crates/vm" }

[[bin]]
name = "portable_bytecode_decoder"
path = "fuzz_targets/portable_bytecode_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "typed_source_hir"
path = "fuzz_targets/typed_source_hir.rs"
test = false
doc = false
bench = false

[[bin]]
name = "source_parser"
path = "fuzz_targets/source_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "component_metadata_decoder"
path = "fuzz_targets/component_metadata_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "versioned_component_contract_decoder"
path = "fuzz_targets/versioned_component_contract_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "versioned_component_failure_report_decoder"
path = "fuzz_targets/versioned_component_failure_report_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ownership_mir_types"
path = "fuzz_targets/ownership_mir_types.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
